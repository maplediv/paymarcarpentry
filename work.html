    <script>
        (function() {
            var lightbox = document.getElementById('imageLightbox');
            var lightboxImg = document.getElementById('imageLightboxImg');
            var closeBtn = lightbox.querySelector('.image-lightbox-close');
            var expandableItems = document.querySelectorAll('.work-gallery-item');

            function openLightbox(src, alt) {
                lightboxImg.src = src;
                lightboxImg.alt = alt || 'Expanded view';
                lightbox.classList.add('image-lightbox-open');
                lightbox.setAttribute('aria-hidden', 'false');
                document.body.style.overflow = 'hidden';
            }

            function closeLightbox() {
                lightbox.classList.remove('image-lightbox-open');
                lightbox.setAttribute('aria-hidden', 'true');
                document.body.style.overflow = '';
            }

            expandableItems.forEach(function(item) {
                item.addEventListener('click', function() {
                    var img = this.querySelector('img');
                    openLightbox(img.src, img.alt);
                });
            });

            closeBtn.addEventListener('click', closeLightbox);
            lightbox.addEventListener('click', function(e) {
                if (e.target === lightbox) closeLightbox();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape' && lightbox.classList.contains('image-lightbox-open')) closeLightbox();
            });
        })();
    </script>
